{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-16 text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-900 border border-slate-800 text-slate-400 mb-6">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>

    <h1 class="text-4xl font-extrabold text-white tracking-tight mb-3">404 — Page Not Found</h1>
    <p class="text-slate-400 text-base mb-8">
        The page you are looking for does not exist, has been removed, or is temporarily unavailable.
    </p>

    <div class="flex justify-center gap-4">
        <a href="{{ url_for('students.list_students') }}"
           class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20">
            &larr; Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}

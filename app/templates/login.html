{% extends "base.html" %}

{% block title %}Teacher Login — Face Attendance{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white tracking-tight">Teacher Login</h1>
        <p class="text-slate-400 mt-2 text-sm">Sign in to manage students, enroll faces, and take classroom attendance.</p>
    </div>

    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div>
            <label class="block mb-2 text-sm font-medium text-slate-200">Username</label>
            <input type="text" name="username" required autocomplete="username"
                placeholder="Enter your username"
                class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 outline-none focus:border-blue-500 transition">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-slate-200">Password</label>
            <input type="password" name="password" required autocomplete="current-password"
                placeholder="Enter your password"
                class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 outline-none focus:border-blue-500 transition">
        </div>

        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white p-3.5 rounded-xl font-semibold transition shadow-lg shadow-blue-600/20">
            Sign In
        </button>

        <div class="pt-6 border-t border-slate-800/80 text-center text-sm text-slate-400">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" class="text-blue-400 hover:text-blue-300 font-medium ml-1 transition">
                Create an account
            </a>
        </div>

    </form>

</div>

{% endblock %}
